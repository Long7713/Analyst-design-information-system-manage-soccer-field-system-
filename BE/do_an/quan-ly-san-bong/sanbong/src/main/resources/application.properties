spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/quan_ly_san_bong
# 2) Tài khoản MySQL (giống lúc bạn đăng nhập MySQL Workbench)
spring.datasource.username=${DB_USERNAME:root}
# 3) Mật khẩu MySQL  → ĐỔI THÀNH MẬT KHẨU CỦA BẠN
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------
# JPA: "none" = KHÔNG tự sửa cấu trúc bảng (bảng do file .sql tạo)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

server.port=8080
spring.thymeleaf.cache=false
spring.web.locale=vi_VN
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Quy tắc tính giá khi đơn đi qua 2 khung giá (ví dụ 16h-18h)
#   false = tính từng khung (16-17 = giá khung 1, 17-18 = giá khung 2)   ← theo file Đặc tả nghiệp vụ
#   true  = tính theo khung của GIỜ BẮT ĐẦU (cả đơn tính giá khung 16h)  ← theo ghi chú trong file thiết kế DB
app.gia.theo-gio-bat-dau=false
