<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Chi tiết đơn')}"></head>
<body>
<div class="app">
<aside th:replace="~{fragments/layout :: sidebar('datsan')}"></aside>
<div class="main-col">
<header th:replace="~{fragments/layout :: topbar('Chi tiết đơn')}"></header>
<main class="content">
<div th:replace="~{fragments/layout :: thongbao}"></div>

<div class="page-head"><div><h1 th:text="'Đơn đặt sân SBL-' + ${d.maDatSan}">Đơn</h1>
 <p class="sub"><a href="javascript:history.back()">‹ Quay lại</a> · <a th:href="@{/lich-san(ngay=${d.ngay})}">Xem trên lịch sân</a></p></div></div>
<div class="alert warn" th:if="${canhBao}" th:text="'⚠ ' + ${canhBao}"></div>
<div class="grid2">
 <div class="panel"><div class="panel-b" th:insert="~{fragments/booking :: panel(${d}, ${veUrl})}"></div></div>
 <div>
  <div class="panel" th:if="${d.canDoiGio}"><div class="panel-h"><h3>Đổi thời gian</h3><span class="muted">Chỉ khi còn ≥ 3 tiếng, trong cùng ngày</span></div><div class="panel-b">
    <p class="muted">Khung giờ cũ: <b th:text="${d.batDau} + ' → ' + ${d.ketThuc}"></b> · Thời lượng cũ: <b th:text="${d.soGio} + ' giờ'"></b></p>
    <form id="formDoi" method="post" th:action="@{/dat-san/{id}/doi-gio(id=${d.maDatSan})}">
      <div class="form-grid">
        <div><label>Thời gian bắt đầu mới</label><select name="batDau" onchange="kiemTraDoi(ID)"><option th:each="g : ${gioDat}" th:value="${g}" th:text="${g}" th:selected="${g == d.batDau}"></option></select></div>
        <div><label>Thời lượng mới</label><select name="soPhut" onchange="kiemTraDoi(ID)"><option th:each="p : ${thoiLuong}" th:value="${p}" th:text="${p == 60 ? '1 giờ' : (p == 90 ? '1,5 giờ' : '2 giờ')}" th:selected="${p * 1 == dat.soPhut}"></option></select></div>
      </div>
      <div class="kq" id="kqDoi"></div>
      <button class="btn primary" id="btnDoi" disabled>Xác nhận đổi thời gian</button>
    </form></div></div>

  <div class="panel" th:if="${d.trangThai == 'dang_da'}"><div class="panel-h"><h3>Thêm giờ</h3><span class="muted">30 phút = 50.000đ · khi còn ≤ 20 phút</span></div><div class="panel-b">
    <form id="formThem" method="post" th:action="@{/dat-san/{id}/them-gio(id=${d.maDatSan})}">
      <label>Số phút muốn thêm (chia hết cho 30)</label>
      <select name="soPhut" onchange="kiemTraThem(ID)"><option value="30">30 phút</option><option value="60">60 phút</option><option value="90">90 phút</option><option value="120">120 phút</option></select>
      <div class="kq" id="kqThem"></div>
      <button class="btn primary" id="btnThem" disabled>Xác nhận thêm giờ</button>
    </form></div></div>

  <div class="panel" th:if="${!#lists.isEmpty(dat.dsThemGio)}"><div class="panel-h"><h3>Lịch sử thêm giờ</h3></div>
    <table><tr><th>Lúc</th><th>Kết thúc mới</th><th class="r">Phút</th><th class="r">Tiền</th><th>NV</th></tr>
    <tr th:each="t : ${dat.dsThemGio}"><td th:text="${#temporals.format(t.thoiDiemThem,'dd/MM HH:mm')}"></td><td th:text="${t.ketThucMoiStr}"></td><td class="r" th:text="${t.soPhutThem}"></td>
      <td class="r" th:text="${#numbers.formatInteger(t.tienThemGio,1,'POINT')}"></td><td th:text="${t.nhanVien != null} ? ${t.nhanVien.hoTen} : ''"></td></tr></table></div>

  <div class="panel" th:if="${!#lists.isEmpty(lichSuDoi)}"><div class="panel-h"><h3>Lịch sử đổi thời gian</h3></div>
    <table><tr><th>Lúc đổi</th><th>Giờ cũ</th><th>Giờ mới</th><th>NV</th></tr>
    <tr th:each="l : ${lichSuDoi}"><td th:text="${#temporals.format(l.thoiDiemDoi,'dd/MM HH:mm')}"></td><td th:text="${l.cuStr}"></td><td th:text="${l.moiStr}"></td><td th:text="${l.nhanVien != null} ? ${l.nhanVien.hoTen} : ''"></td></tr></table></div>
 </div>
</div>

</main>
</div>
</div>
<div th:replace="~{fragments/booking :: modalDatSan}"></div>
<div th:replace="~{fragments/booking :: modalChiTiet}"></div>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
const ID=/*[[${d.maDatSan}]]*/0;
window.addEventListener('load',()=>{ if(document.getElementById('formDoi')) kiemTraDoi(ID); if(document.getElementById('formThem')) kiemTraThem(ID); });
</script>
</body>
</html>
