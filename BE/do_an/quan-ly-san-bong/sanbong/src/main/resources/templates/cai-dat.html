<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Cài đặt hệ thống')}"></head>
<body>
<div class="app">
<aside th:replace="~{fragments/layout :: sidebar('caidat')}"></aside>
<div class="main-col">
<header th:replace="~{fragments/layout :: topbar('Cài đặt hệ thống')}"></header>
<main class="content">
<div th:replace="~{fragments/layout :: thongbao}"></div>

<div class="page-head"><div><h1>Cài đặt hệ thống</h1><p class="sub">Bảng giá lưu trong cơ sở dữ liệu (không hard-code). Đổi giá chỉ áp dụng cho đơn đặt mới.</p></div></div>
<div class="panel"><div class="panel-h"><h3>Bảng giá sân</h3>
 <details><summary class="btn primary">＋ Thêm bảng giá</summary>
  <form method="post" th:action="@{/cai-dat/bang-gia/luu}" class="form-grid panel" style="padding:14px;min-width:460px;position:absolute;right:30px;z-index:5">
   <div><label>Loại ngày</label><select name="loaiNgay"><option value="ngay_thuong">Ngày thường (T2–T6)</option><option value="cuoi_tuan">Cuối tuần (T7, CN)</option></select></div>
   <div><label>Giá / giờ</label><input type="number" name="giaMoiGio" min="1000" required></div>
   <div><label>Từ giờ</label><select name="gioBatDau"><option th:each="g : ${gioGia}" th:value="${g}" th:text="${g}"></option></select></div>
   <div><label>Đến giờ</label><select name="gioKetThuc"><option th:each="g : ${gioGia}" th:value="${g}" th:text="${g}" th:selected="${g=='24:00'}"></option></select></div>
   <div><label>Áp dụng từ ngày</label><input type="date" name="apDungTu"></div><div><label>Áp dụng đến ngày</label><input type="date" name="apDungDen"></div>
   <div class="chk"><input type="checkbox" name="kichHoat" value="true" checked id="kh0"><label for="kh0" style="margin:0">Bật</label></div><div><button class="btn primary">Lưu</button></div></form></details></div>
 <table><tr><th>Loại ngày</th><th>Khung giờ</th><th class="r">Giá / giờ</th><th>Áp dụng</th><th>Trạng thái</th><th>Thao tác</th></tr>
  <tr th:each="b : ${dsGia}"><td th:text="${b.loaiNgay=='cuoi_tuan'} ? 'Cuối tuần' : 'Ngày thường'"></td><td class="mono" th:text="${b.batDauStr} + ' → ' + ${b.ketThucStr}"></td>
   <td class="r"><b th:text="${#numbers.formatInteger(b.giaMoiGio,1,'POINT')} + 'đ'"></b></td>
   <td class="muted" th:text="${b.apDungTu == null and b.apDungDen == null} ? 'Không giới hạn' : (${b.apDungTu} + ' → ' + ${b.apDungDen})"></td>
   <td><span class="badge" th:classappend="${b.kichHoat} ? 'xanh' : 'do'" th:text="${b.kichHoat} ? 'Đang bật' : 'Đã tắt'"></span></td>
   <td style="white-space:nowrap">
    <details style="display:inline-block"><summary class="btn sm">Sửa</summary>
     <form method="post" th:action="@{/cai-dat/bang-gia/luu}" class="form-grid panel" style="padding:12px;min-width:420px;position:absolute;z-index:5">
      <input type="hidden" name="maBangGia" th:value="${b.maBangGia}"><input type="hidden" name="loaiNgay" th:value="${b.loaiNgay}">
      <input type="hidden" name="gioBatDau" th:value="${b.batDauStr}"><input type="hidden" name="gioKetThuc" th:value="${b.ketThucStr}">
      <div><label>Giá / giờ</label><input type="number" name="giaMoiGio" th:value="${b.giaMoiGio}" required></div><div></div>
      <div><label>Áp dụng từ</label><input type="date" name="apDungTu" th:value="${b.apDungTu}"></div><div><label>Áp dụng đến</label><input type="date" name="apDungDen" th:value="${b.apDungDen}"></div>
      <div class="chk"><input type="checkbox" name="kichHoat" value="true" th:checked="${b.kichHoat}"><label style="margin:0">Bật</label></div><div><button class="btn sm primary">Lưu</button></div></form></details>
    <form style="display:inline" method="post" th:action="@{/cai-dat/bang-gia/{id}/bat-tat(id=${b.maBangGia})}"><button class="btn sm" th:text="${b.kichHoat} ? 'Tắt' : 'Bật'"></button></form></td></tr></table></div>

<div class="panel"><div class="panel-h"><h3>Danh mục sân</h3></div>
 <form th:each="s : ${dsSanCd}" method="post" th:action="@{/cai-dat/san/{ma}/luu(ma=${s.maSan})}" class="toolbar" style="background:#fff">
   <b style="width:80px" th:text="${s.ten}"></b>
   <select name="trangThai"><option value="hoat_dong" th:selected="${s.trangThai=='hoat_dong'}">Hoạt động</option><option value="ngung_hoat_dong" th:selected="${s.trangThai=='ngung_hoat_dong'}">Ngừng hoạt động</option></select>
   <input name="ghiChu" th:value="${s.ghiChu}" placeholder="Ghi chú" style="flex:1"><button class="btn sm">Lưu</button>
 </form></div>
</main>
</div>
</div>
<div th:replace="~{fragments/booking :: modalDatSan}"></div>
<div th:replace="~{fragments/booking :: modalChiTiet}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
